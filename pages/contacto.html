    <section>
      <h2> Haz tu pedido o Contactános</h2>

      <form action="#" method="post">
        <fieldset>
          <legend> Datos de Pedido y Contacto</legend>

          <p>
            <label for="contacto-nombre">Nombre completo:</label>
            <br>
            <input type="text" id="contacto-nombre" name="contacto-nombre" required>
          </p>

          <p>
            <label for"contacto-email">Correo electrónico:</label>
            <br>
            <input type="email" id="contacto-email" name="contacto-email" required>
          </p>

          <p>
            <label for="contacto-telefono">Teléfono o WhatsApp (9 dígitos):</label>
            <br>
            <input type="tel" id="contacto-telefono" name="telefono" pattern="[0-9]{9}" required> 
          </p>

          <p> 
            <label for="contacto-tipo"> Tipo de cliente:</label>
            <br>
            <select id="contacto-tipo" name="tipo" required>
              <option value="">--Seleccione una opción--</option>
              <option value="nuevo">Cliente Nuevo</option>
              <option value="frecuente">Cliente frecuente</option>
              <option value="mayorista">Cliente mayorista</option>
            </select>

            <br><br>
          </p>

          <p>
            <label for="contacto-mensaje">Mensaje o detalle de granos requeridos:</label>
            <br>
            <textarea id="contacto-mensaje" name="mensaje" rows="4" required></textarea>
          </p>

          <button type="submit">
            Enviar Solicitud
          </button>
        </fieldset>
      </form>
    </section>
    </main>
  </body>
</html>
